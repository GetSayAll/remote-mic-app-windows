name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Check Windows Tauri host
        run: cargo check --workspace

      - name: Build unsigned NSIS preview installer
        run: pnpm tauri build --bundles nsis

      - name: Verify installer identity and create checksums
        shell: pwsh
        run: ./scripts/verify-windows-bundle.ps1

      - name: Test silent current-user install and uninstall
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/test-windows-silent-install.ps1

      - name: Upload unsigned preview installer
        uses: actions/upload-artifact@v4
        with:
          name: sayall-windows-unsigned-preview-${{ github.sha }}
          path: artifacts/windows-preview/
          if-no-files-found: error
          retention-days: 14
