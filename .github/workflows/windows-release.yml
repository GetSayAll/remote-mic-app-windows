name: Windows Release

# 正式发布管线（应用内更新通道）：
# 1. push 形如 v0.2.0 的 tag 触发；
# 2. 用仓库 Secret TAURI_SIGNING_PRIVATE_KEY 构建 minisign 签名的 NSIS 安装器
#    （缺 Secret 直接失败——禁止用一次性密钥发布正式更新包）；
# 3. 生成 latest.json（updater 静态清单）并把资产重命名为纯 ASCII 文件名；
# 4. 创建 DRAFT Release 并挂载资产——人工核对后点 Publish 才对全量用户生效
#    （releases/latest/download/latest.json 只统计已发布的稳定 Release）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 发布路径必须带 arm64 载荷（见下方 staging / build 两步），因此本 job 也要
          # 装 aarch64 目标供 `cargo build --target aarch64-pc-windows-msvc` 使用；
          # 链接器由 windows-2025 镜像自带的 VS ARM64 工具集提供。
          targets: aarch64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing secret is present
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "缺少 TAURI_SIGNING_PRIVATE_KEY 仓库 Secret：正式 Release 必须用正式更新签名密钥构建（私钥丢失即无法再向存量用户推送更新，请先在 GitHub Secrets 配置并本地备份私钥）"
          }
          Write-Host "正式更新签名密钥已就绪"

      # 同 windows-ci.yml：bundle.resources 的两件文件不入库，编译期就需要它们存在。
      # 发布路径**强制**要求 arm64 双载荷（windows-2025 镜像自带 VS ARM64 工具集）：
      # SAYALL_REQUIRE_ARM64_PAYLOAD=1 让 arm64 缺失时 staging 非零退出，而不是静默
      # 产出一个在 Windows 11 ARM64 上缺载荷的安装包。
      - name: Stage bundle resources (helper + frida gadget, x64 + arm64)
        env:
          SAYALL_REQUIRE_ARM64_PAYLOAD: "1"
        run: node scripts/stage-bundle-inputs.cjs

      - name: Build signed NSIS installer
        # arm64 覆盖配置：默认 tauri.conf.json 只声明 x64 两件（tauri-build 编译期
        # 校验资源存在，arm64 助手在没有 VS ARM64 工具集的机器上构建不出来），
        # 这里把 bundle.resources 覆盖成四件。--config 可重复，按 RFC 7396 顺序合并。
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.arm64-payload.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 密码变量缺失时 tauri build 会交互式等待输入（无 TTY 的 CI 上挂死，
          # 2026-09-06 本机矩阵实验实证）；正式密钥为无密码密钥，Secret 未配置时
          # 此处求值为空字符串，实测空字符串 + 无密码密钥可免交互完成签名。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 防回归（2026-10-03 本机实证）：补丁 build.frontendDist 误用 Windows 绝对路径时，
      # tauri 会把它当单字母 scheme 的 URL，前端资源不嵌入、界面变成目录列表。
      - name: Verify frontend assets are embedded in the executable
        shell: pwsh
        run: ./scripts/verify-frontend-embedded.ps1

      - name: Generate updater manifest and stage release assets
        shell: pwsh
        run: ./scripts/generate-updater-manifest.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Show staged assets before release (delete-free verification)
        shell: pwsh
        run: |
          Write-Host "将上传到 Draft Release $env:GITHUB_REF_NAME 的资产清单："
          Get-ChildItem -LiteralPath "artifacts/windows-release" -File |
            ForEach-Object { Write-Host ("- {0} ({1} bytes)" -f $_.Name, $_.Length) }

      - name: Create draft GitHub release with assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem -LiteralPath "artifacts/windows-release" -File | ForEach-Object { $_.FullName }
          # Release Notes 正文（按 docs/release-notes-spec.md 撰写；聚合口径 = 相对上一个
          # 已发布版本 v1.8.3）。内容变化要回到普通 PR 改这里，再打新 tag，不覆盖旧正文。
          $notes = @"
          # 无线麦 SayAll Windows 版 $tag 预览版

          本次更新（相对上一个已发布版本 v1.8.3）：

          ## 新增

          - 新增「APP 适配」页：应用的聚焦设置集中在这里，能看到真实应用图标，也可以从开始菜单或桌面快捷方式添加应用。
          - 「选择应用」改为单选，支持搜索、本机扫描与程序选择，添加后立即生效。
          - 组合动作里的「聚焦输入框」步骤不再要求先创建聚焦配置，可以直接选择目标应用。
          - 每个应用可以单独设置滚动区域和翻页动作，上、下翻页与回到顶部、底部都能绑定到遥控器按键。
          - 组合动作支持「切换应用」会话：按下按键后可用左、右键选择窗口，按“确定”切换，按返回取消。
          - 回眸新增「本地 Agent 访问」：可以把语音记录只读开放给 Codex、Claude Code、Cursor、OpenCode 等本机工具，随时可以撤销授权。

          ## 改进

          - 首次设置向导新增「全按键支持」说明与开启引导；第①步的配对提示补充了高级设置入口。
          - 侧栏与标题栏按 Mac 版重做：账号区、更紧凑的布局，权限入口合并进设置页。
          - 窗口最小尺寸固定为 1066×800，标题栏上的 Ctrl+W 可以正常关闭窗口。
          - 回眸在切换页面时不再整页刷新，应用选择、日期折叠与滚动位置都会保留。
          - 个人中心切换页面时保留原有内容，累计语音时长改为「x分y秒」的紧凑格式。
          - 触摸板拖动只滚动内容区，不再拖出空白页面。
          - 组合动作执行后的状态提示会在 8 秒后自动隐藏。

          ## 修复

          - 回眸里 Chrome 等应用的图标不再变成黑白块；旧图标缓存会自动重建。
          - 微信、腾讯电脑管家截图工具，以及本应用自己的录音，都会显示正确的应用名；长应用名不再被省略号截断。
          - 长按遥控器 F5 期间中止语音会话后，不再出现重复按键或粘键。
          - 关机或注销时不再弹出计划任务窗口，应用会先停止后台任务再退出。
          - 从回眸打开其他应用前会先撤掉自身窗口置顶，目标窗口不再被遮挡。
          - 升级后再回退到旧版本，已有按键配置不会丢失。
          - 修复 Alt+Tab 与 Win+D 注入后主窗口键盘无响应的问题。
          - 禁用状态的按钮不再显示禁止光标。

          ## 验证

          - 本次构建的前端测试、Rust 工作区测试与 Windows 运行时仿真检查：passed（CI verify，同一提交）。
          - 安装、升级与卸载矩阵（含应用运行中执行安装）：由 main 安装器流水线在同一提交运行，发布前请核对结果。
          - 语音键、全按键支持与回眸记录在 RC001 / RC003 真机上的端到端确认：deferred（开发机没有真机）。

          ## 已知边界

          - 安装器尚未配置 Windows 代码签名，首次运行可能出现 SmartScreen 提示。
          - 「全按键支持」属于系统级按键接管，需要系统授权（每次开启都会弹出 Windows 授权窗口）；个别带防作弊保护的游戏可能按键失灵或游戏打不开，建议玩这类游戏前关闭该开关。
          - 语音输入工具的麦克风要选 **CABLE Output**，不要用「自动检测」：自动检测跟随系统默认录音设备，若默认设备是内置麦克风或「立体声混音」，识别结果会与你说的话出入较大。
          - 已经用过的电脑升级后不会自动进入首次设置向导，可在设置页点「重新运行向导」。
          - Windows 11 ARM64 上的「全按键支持」尚未真机验收（开发机没有 ARM64 硬件）；语音与普通按键不受影响。
          "@
          gh release create $tag --draft --prerelease --title "无线麦 SayAll Windows $tag 预览版" --notes $notes @assets
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create 失败（exit $LASTEXITCODE；若 Release 已存在请人工核对后处理，本流程不做任何删除/覆盖）"
          }
          Write-Host "Draft Release $tag 已创建并挂载资产，等待人工核对与 Publish"
