[package]
name = "sayall-windows-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sayall_windows_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 走查/仿真构建：转发给常用语组件，让「会员走查开关」
# （SAYALL_COMMON_PHRASES_ASSUME_MEMBER=1）在该构建上生效（评审 M1 的走查通道）。
runtime-simulation = ["sayall-windows-common-phrases/runtime-simulation"]
# 验证用 debug 包也隐藏控制台窗口（打包时启用；dev 流程不受影响）。
hide-console = []

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
sayall-core = { path = "../crates/sayall-core" }
sayall-windows = { path = "../crates/sayall-windows" }
sayall-windows-common-phrases = { path = "../crates/sayall-windows-common-phrases" }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.4", default-features = false }
quick-xml = { version = "0.41", features = ["serialize"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
# `unstable` 提供主窗口内嵌子 WebView（推荐页直接加载官网；官网禁止 iframe）。
tauri = { version = "2.8", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2.11.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "UI_ViewManagement",
] }
# webview2-com 0.38 的绑定由 windows 0.61 生成；主工程其余代码用 0.62。
# 推荐页的 NavigationCompleted 参数必须使用 0.61 的 BOOL/PWSTR 类型。
windows-core-061 = { package = "windows-core", version = "0.61" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
