[package]
name = "sayall-windows-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sayall_windows_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
runtime-simulation = []

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
sayall-core = { path = "../crates/sayall-core" }
sayall-windows = { path = "../crates/sayall-windows" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
